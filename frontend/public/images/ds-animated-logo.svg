<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 600 160" width="600" height="160" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Dark Synapses</title>
  <desc id="logoDesc">Pixel mountain with gently drifting signal pixels, Dark Synapses wordmark and tagline.</desc>
  <style>
    .bg { fill: #000000; }
    .title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 36px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .tagline {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      letter-spacing: 2.5px;
      fill: #8a8f98;
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .p1, .p2, .p3, .p4, .p5, .p6, .p7, .p8 { animation: none !important; opacity: 1; }
    }
    .cursor {
      fill: #1b8cff;
      animation: blink 1.2s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    /* Floating pixel animations in different directions */
    @keyframes floatUpRight {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 0.8; }
      100% { transform: translate(26px, -48px); opacity: 0; }
    }
    @keyframes floatUp {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      20%  { opacity: 1; }
      85%  { opacity: 0.7; }
      100% { transform: translate(4px, -58px); opacity: 0; }
    }
    @keyframes floatDriftRight {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      25%  { opacity: 0.9; }
      85%  { opacity: 0.5; }
      100% { transform: translate(48px, -24px); opacity: 0; }
    }

    .p1 { animation: floatUp 3.2s linear infinite; }
    .p2 { animation: floatUpRight 2.8s linear infinite 0.5s; }
    .p3 { animation: floatDriftRight 3.6s linear infinite 1.1s; }
    .p4 { animation: floatUpRight 4.0s linear infinite 1.7s; }
    .p5 { animation: floatUp 2.6s linear infinite 0.9s; }
    .p6 { animation: floatDriftRight 3.4s linear infinite 2.2s; }
    .p7 { animation: floatUpRight 3.1s linear infinite 2.6s; }
    .p8 { animation: floatUp 3.8s linear infinite 1.4s; }
  </style>

  <!-- Remove this rect if you want a transparent background -->
  <!-- Transparent background for use over the existing dark navigation and footer -->

  <!-- Pixel Mountain Base -->
  <g>
    <!-- White/Light Grey Mountain Core -->
    <rect x="296" y="64" width="8" height="8" fill="#ffffff" />
    <rect x="288" y="72" width="16" height="8" fill="#ffffff" />
    <rect x="280" y="80" width="24" height="8" fill="#ffffff" />
    <rect x="272" y="88" width="24" height="8" fill="#ffffff" />
    <rect x="296" y="88" width="16" height="8" fill="#9aa0a6" />
    <rect x="264" y="96" width="24" height="8" fill="#ffffff" />
    <rect x="288" y="96" width="24" height="8" fill="#7c828a" />
    <rect x="256" y="104" width="24" height="8" fill="#ffffff" />
    <rect x="280" y="104" width="32" height="8" fill="#9aa0a6" />
    <rect x="248" y="112" width="24" height="8" fill="#d2d5d9" />
    <rect x="272" y="112" width="48" height="8" fill="#7c828a" />

    <!-- Static Dissolving Edge Pixels -->
    <rect x="312" y="80" width="8" height="8" fill="#1b8cff" />
    <rect x="320" y="96" width="8" height="8" fill="#5f6368" />
    <rect x="328" y="104" width="8" height="8" fill="#1b8cff" />
    <rect x="320" y="112" width="8" height="8" fill="#ffffff" />
    <rect x="336" y="112" width="8" height="8" fill="#1b8cff" />

    <!-- Animated Floating Pixels -->
    <rect class="p1" x="304" y="64" width="6" height="6" fill="#1b8cff" />
    <rect class="p2" x="316" y="76" width="6" height="6" fill="#ffffff" />
    <rect class="p3" x="324" y="88" width="6" height="6" fill="#1b8cff" />
    <rect class="p4" x="310" y="72" width="6" height="6" fill="#8a8f98" />
    <rect class="p5" x="332" y="96" width="5" height="5" fill="#1b8cff" />
    <rect class="p6" x="340" y="108" width="5" height="5" fill="#5f6368" />
    <rect class="p7" x="298" y="60" width="5" height="5" fill="#63b3ff" />
    <rect class="p8" x="326" y="82" width="5" height="5" fill="#d2d5d9" />
  </g>

  <!-- Brand Text -->
  <text x="292" y="168" text-anchor="middle" class="title">DARK SYNAPSES</text>
  <rect class="cursor" x="458" y="162" width="22" height="5" />
  <text x="300" y="196" text-anchor="middle" class="tagline">WHERE INTELLIGENCE MEETS THREATS</text>
</svg>