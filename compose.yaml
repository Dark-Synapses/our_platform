services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DS_MONGO_HOST: mongo
      DS_MONGO_USERNAME: ${MONGO_USERNAME:?Copy .env.example to .env first}
      DS_MONGO_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      DS_MONGO_DATABASE: ${MONGO_DATABASE:-dark_synapses}
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
