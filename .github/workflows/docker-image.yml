name: Docker Build CI

on:
  push:
    branches:
      - main
      - fix/ui-icons-responsive-v1
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -f backend/Dockerfile -t dark-synapses-backend ./backend

  frontend-build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Frontend
        run: docker build -f frontend/Dockerfile -t dark-synapses-frontend ./frontend

  frontend-typecheck:
    name: Frontend TypeScript and Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check and Production Build
        run: npm run build
